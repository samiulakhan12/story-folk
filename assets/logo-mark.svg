		<ellipse cx="38.4" cy="28.4" rx="2.7" ry="3.4" fill="#111" stroke="none"/>
		<circle cx="26.5" cy="27.2" r="0.95" fill="#fff" stroke="none"/>
		<circle cx="39.3" cy="27.2" r="0.95" fill="#fff" stroke="none"/>
