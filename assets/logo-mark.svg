		<path d="M49.4 41C49.8 37.4 47.6 35.4 44.8 35.8C42.2 36.2 41.2 38.6 41.8 40.6" fill="#fff" stroke-width="3"/>
		<path d="M18.6 37.6V39.8M45.4 37.6V39.8" fill="none" stroke-width="1.8"/>
	</g>
</svg>
