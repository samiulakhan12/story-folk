		<path d="M32 42.6V56.6" fill="none" stroke-width="3"/>
		<!-- page lines -->
		<path d="M11.6 45C16.8 44.4 22.2 45 26.4 46.8M11.6 48.6C15.4 48.2 19.4 48.6 22.6 49.6" fill="none" stroke-width="1.9"/>
